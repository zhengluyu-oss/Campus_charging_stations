#服务器配置:
server:
  port: 8081
  servlet:
    context-path: /admin
#spring配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_charging_station?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  #数据库自动初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

    #静态资源访问配置
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        #配置读取项目外资源（注意：上传文件的位置要 读取的位置要一致 file.basePath）
        - file:${FILE_UPLOAD_PATH:F:\guochuang\my_project_useful\the_first\文件存储}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT:6379}
      database: 1

  #文件上传位置
  servlet:
    multipart:
      #配置上传文件最大值
      max-file-size: 10MB
      #配置请求数据最大值
      max-request-size: 50MB
  profiles:
    active: dev

#springdoc配置
springdoc:
  # 1. 原始 JSON 数据路径 (Apifox 同步时用的就是这个)
  api-docs:
    path: /v3/api-docs
    enabled: true # 是否开启，生产环境建议设为 false

  # 2. Swagger 网页界面路径 (供开发人员手动查看)
  swagger-ui:
    path: /swagger-ui.html
    # 开启这个后，访问 /swagger-ui.html 会自动跳转到真正的静态资源页面
    operations-sorter: alpha # 接口按字母顺序排序，方便找接口
    swagger-ui:
      # 是否显示请求耗时
      display-request-duration: true
      # 默认展开级别 (none, list, full)
      doc-expansion: list
      # 是否支持手动输入 JSON 导入接口（通常不用开启）
      disable-swagger-default-url: true

#mybatis-plus配置
mybatis-plus:
  #配置映射文件的位置 类路径下mapper目录下或者子子孙孙目录下，以.xml后缀的配置文件
  mapper-locations: classpath*:/mapper/**/*.xml
  #配置类型别名
  type-aliases-package: com.tjetc.entity
  #配置typehandler类型处理器
  type-handlers-package: com.tjetc.handler
  #控制台输出sql日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


#配置文件上传位置
file:
  basePath: ${FILE_BASE_PATH:D:/temp}
# JWT: secret must be at least 32 characters in production (HS256)
jwt:
  secret: ${JWT_SECRET}
  token:
    expired: 1800000  # 30分钟（原36000000ms ≈ 10小时）
#日志配置
logging:
  file:
    path: ${LOG_PATH:D:/temp/mylog.log}  #日志文件存储路径
